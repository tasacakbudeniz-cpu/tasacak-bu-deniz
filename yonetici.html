<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Yönetici</title>
<style>*{box-sizing:border-box}body{margin:0;background:#04162a;color:#fff;font:15px/1.45 system-ui,sans-serif;padding:14px;max-width:720px;margin:auto}h2{margin:6px 0 12px}.c{background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:12px;margin:10px 0}.s{opacity:.65;font-size:13px}input,select,textarea{width:100%;background:#ffffff14;border:1px solid #ffffff2a;border-radius:10px;color:#fff;padding:11px;font:inherit;margin:5px 0}button{background:#1b7fa3;color:#fff;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;margin:4px 0}button.g{background:#ffffff1c}button.d{background:#b3342d}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs button{white-space:nowrap}.tabs button.on{background:#f5b942;color:#000}#t{position:fixed;left:12px;right:12px;bottom:14px;background:#000d;border-radius:12px;padding:12px;display:none;z-index:9}option{color:#000}</style></head><body>
<div id="app"></div><div id="t"></div>
<script>
const PID='tasacak-bu-deniz',KEY='AIzaSyA2fLglxA3TE7HVhABqpWC2VAbjVhSCjL8',FB='https://firestore.googleapis.com/v1/projects/'+PID+'/databases/(default)/documents',DOC='projects/'+PID+'/databases/(default)/documents/';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TK='',UID='',EXP=0,ADM=0,TAB='post',ST={};
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)};
const fS=v=>({stringValue:String(v)}),fI=v=>({integerValue:String(v)}),fB=v=>({booleanValue:!!v}),fid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>x.toString(36).padStart(2,'0')).join('').slice(0,20);
const nv=f=>!f?null:f.stringValue!=null?f.stringValue:f.integerValue!=null?+f.integerValue:f.booleanValue!=null?f.booleanValue:f.timestampValue!=null?f.timestampValue:null;
async function auth(){if(TK&&Date.now()<EXP-3e5)return;const rt=sessionStorage.rt;if(!rt)throw new Error('NOAUTH');const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});if(!r.ok)throw new Error('NOAUTH');const j=await r.json();TK=j.id_token;UID=j.user_id;EXP=Date.now()+j.expires_in*1e3;sessionStorage.rt=j.refresh_token}
async function api(u,b){await auth();const r=await fetch(u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:b?JSON.stringify(b):undefined});if(r.status==404)return null;if(!r.ok){const t=await r.json().catch(()=>({}));throw new Error((t.error&&t.error.message)||r.status)}return r.json()}
async function fq(par,coll,sq){const r=await api(FB+(par?'/'+par:'')+':runQuery',{structuredQuery:{from:[{collectionId:coll}],...sq}});return(r||[]).filter(x=>x.document).map(x=>{const f=x.document.fields||{},o={id:x.document.name.split('/').pop()};for(const k in f)o[k]=nv(f[k]);return o})}
const setDoc=(p,f,t=1)=>api(FB+':commit',{writes:[{update:{name:DOC+p,fields:f},...(t?{updateTransforms:[{fieldPath:'t',setToServerValue:'REQUEST_TIME'}]}:{})}]});
const delDocs=ps=>api(FB+':commit',{writes:ps.map(p=>({delete:DOC+p}))});
async function login(){const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return toast('E-posta ve şifre yaz');const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const j=await r.json();if(!r.ok)return toast('Giriş olmadı: '+((j.error&&j.error.message)||r.status));sessionStorage.rt=j.refreshToken;TK=j.idToken;UID=j.localId;EXP=Date.now()+j.expiresIn*1e3;await boot()}
function logout(){sessionStorage.clear();TK='';ADM=0;view()}
async function boot(){try{ADM=!!(await api(FB+'/adm/'+UID))}catch(e){ADM=0}view();if(ADM)load()}
function view(){const a=$('#app');if(!TK){a.innerHTML=`<h2>🔧 Yönetici girişi</h2><div class="c"><input id="em" type="email" placeholder="E-posta" autocomplete="username"><input id="pw" type="password" placeholder="Şifre" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Giriş yap</button></div>`;return}
 if(!ADM){a.innerHTML=`<h2>🔧 Yönetici</h2><div class="c">Bu hesap yönetici değil.<div class="s" style="margin-top:8px">Kimliğin:</div><b style="word-break:break-all">${UID}</b><div class="s" style="margin-top:8px">Yönetici yapmak için Firebase → Firestore → <b>adm</b> koleksiyonu → belge kimliği olarak bu kimliği gir, içine <b>a</b> alanı (boolean, true) ekle. Sonra sayfayı yenile.</div></div><button class="g" onclick="logout()">Çıkış</button>`;return}
 const T=[['post','🎬 Paylaşım'],['sl','🖼️ Slaytlar'],['ay','⚙️ Ayarlar'],['qx','❓ Sorular'],['st','📊 Durum'],['cm','💬 Yorumlar'],['rp','🚩 Şikâyetler']];
 a.innerHTML=`<div class="r"><h2>🔧 Yönetici</h2><button class="g" onclick="logout()">Çıkış</button></div><div class="tabs">${T.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';view();load()">${t[1]}</button>`).join('')}</div><div id="body"></div>`;draw()}
async function load(){try{if(TAB=='post')ST.p=await fq('','posts',{orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:30});
 if(TAB=='cm'){ST.p=ST.p||await fq('','posts',{orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:30});if(ST.cp)ST.c=await fq('posts/'+ST.cp,'c',{orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:50})}
if(TAB=='sl')await slGet();
 if(TAB=='ay')await ayGet();if(TAB=='qx')await qxGet();if(TAB=='st')await stGet();
 if(TAB=='rp')ST.r=await fq('','rp',{orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:50})}catch(e){toast('Yüklenemedi: '+e.message)}draw()}
function draw(){const b=$('#body');if(!b)return;
 if(TAB=='post')b.innerHTML=`<div class="c"><b>Yeni paylaşım</b><select id="ty" onchange="$('#a').style.display=this.value=='yt'?'block':'none';$('#b').style.display=this.value=='yt'?'none':'block'"><option value="yt">🎬 Fragman (YouTube)</option><option value="img">📸 Fotoğraf</option></select><input id="ti" maxlength="100" placeholder="Başlık"><textarea id="tx" maxlength="500" rows="3" placeholder="Açıklama (isteğe bağlı)"></textarea><div id="a"><input id="yt" placeholder="YouTube linki"></div><div id="b" style="display:none"><input id="f" type="file" accept="image/*"></div><button onclick="pub()">Yayınla</button></div><div class="c"><b>Paylaşımlar</b>${(ST.p||[]).map(p=>`<div class="r" style="margin-top:8px"><span class="s">${p.ty=='yt'?'🎬':'📸'} ${esc(p.ti)}</span><button class="d" onclick="delPost('${p.id}')">Sil</button></div>`).join('')||'<div class="s">Yok.</div>'}</div>`;
 if(TAB=='cm')b.innerHTML=`<div class="c"><select onchange="ST.cp=this.value;ST.c=[];load()"><option value="">Paylaşım seç…</option>${(ST.p||[]).map(p=>`<option value="${p.id}" ${ST.cp==p.id?'selected':''}>${esc(p.ti)}</option>`).join('')}</select></div>${(ST.c||[]).map(c=>`<div class="c"><div class="s">${esc(c.n)}</div>${esc(c.x)}<div><button class="d" onclick="delCm('${ST.cp}','${c.id}')">Yorumu sil</button></div></div>`).join('')||(ST.cp?'<div class="s">Yorum yok.</div>':'')}`;
 if(TAB=='sl')b.innerHTML=slView();
 if(TAB=='ay')b.innerHTML=ayView();if(TAB=='qx')b.innerHTML=qxView();if(TAB=='st')b.innerHTML=stView();
 if(TAB=='rp')b.innerHTML=(ST.r||[]).map(r=>`<div class="c"><div class="s">Şikâyet edilen yorum:</div>${esc(r.x)}<div><button class="d" onclick="rpDel('${r.id}','${r.p}','${r.c}',1)">Yorumu sil + kapat</button> <button class="g" onclick="rpDel('${r.id}','${r.p}','${r.c}',0)">Yoksay</button></div></div>`).join('')||'<div class="c s">Şikâyet yok.</div>'}
function shrink(f,mx=1280,lim=900000){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,mx/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>lim&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);d.length>lim*1.05?no(new Error('Fotoğraf çok büyük')):ok(d)};im.onerror=()=>no(new Error('Fotoğraf açılamadı'));im.src=u})}
async function pub(){const ty=$('#ty').value,ti=$('#ti').value.trim(),tx=$('#tx').value.trim();if(!ti)return toast('Başlık yaz');const id=fid();try{if(ty=='yt'){const m=($('#yt').value.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];if(!m)return toast('YouTube linki anlaşılmadı');await setDoc('posts/'+id,{ty:fS('yt'),ti:fS(ti),tx:fS(tx),yt:fS(m)})}else{const f=$('#f').files[0];if(!f)return toast('Fotoğraf seç');toast('Küçültülüp yükleniyor…');const d=await shrink(f);await setDoc('posts/'+id+'/i/m',{d:fS(d)});await setDoc('posts/'+id,{ty:fS('img'),ti:fS(ti),tx:fS(tx)})}toast('✅ Yayınlandı, uygulamada hemen görünür');load()}catch(e){toast('Hata: '+e.message)}}
async function delPost(id){if(!confirm('Paylaşım ve yorumları silinsin mi?'))return;try{const c=await fq('posts/'+id,'c',{limit:300});await delDocs([...c.map(x=>'posts/'+id+'/c/'+x.id),'posts/'+id+'/i/m','posts/'+id]);toast('Silindi');load()}catch(e){toast('Silinemedi: '+e.message)}}
async function delCm(p,c){if(!confirm('Yorum silinsin mi?'))return;try{await delDocs(['posts/'+p+'/c/'+c]);load()}catch(e){toast('Silinemedi: '+e.message)}}
async function rpDel(id,p,c,k){try{await delDocs((k?['posts/'+p+'/c/'+c]:[]).concat(['rp/'+id]));toast('Tamam');load()}catch(e){toast('Hata: '+e.message)}}

const SG=[['','Dokununca bir şey olmasın'],['quiz','Quiz'],['games','Oyunlar'],['series','Dizi'],['community','Topluluk'],['app','Uygulama'],['feed','Fan Akışı'],['club','Teori Köşesi'],['anket','Anket'],['rank','Lig / Sıralama']];
async function slGet(){const d=await api(FB+'/cfg/sl');ST.sl=d&&d.fields?JSON.parse(nv(d.fields.l)||'[]'):[];ST.si=ST.si||{};for(const x of ST.sl){if(!ST.si[x.id+x.v]){const i=await api(FB+'/cfg/si_'+x.id);ST.si[x.id+x.v]=i&&i.fields?nv(i.fields.d):''}}}
function slView(){const L=ST.sl||[];return`<div class="c"><b>Yeni slayt (en fazla 8)</b><input id="sf" type="file" accept="image/*"><input id="st" maxlength="40" placeholder="Başlık (isteğe bağlı)"><input id="sd" maxlength="80" placeholder="Alt yazı (isteğe bağlı)"><select id="sg">${SG.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select><button onclick="slAdd()">Ekle</button><div class="s">Resim yatay olsun (örneğin 16:9). Otomatik küçültülür.</div></div>${L.map((x,i)=>`<div class="c"><img src="${ST.si[x.id+x.v]||''}" style="width:100%;border-radius:10px;max-height:150px;object-fit:cover"><div class="s">${i+1}. ${esc(x.t||'(başlıksız)')} → ${esc((SG.find(g=>g[0]==x.g)||SG[0])[1])}</div><div class="r"><span><button class="g" onclick="slMove(${i},-1)">⬆</button> <button class="g" onclick="slMove(${i},1)">⬇</button></span><button class="d" onclick="slDel(${i})">Sil</button></div></div>`).join('')||'<div class="c s">Henüz slayt yok. Uygulama kendi hazır slaytlarını gösteriyor.</div>'}`}
async function slSave(L){await setDoc('cfg/sl',{l:fS(JSON.stringify(L))});ST.sl=L;toast('✅ Kaydedildi, uygulamada hemen görünür');draw()}
async function slAdd(){const f=$('#sf').files[0];if(!f)return toast('Resim seç');if((ST.sl||[]).length>=8)return toast('En fazla 8 slayt');try{toast('Küçültülüp yükleniyor…');const d=await shrink(f,1000,250000),id=fid(),v=Date.now();await setDoc('cfg/si_'+id,{d:fS(d)});ST.si[id+v]=d;await slSave([...(ST.sl||[]),{id,v,t:$('#st').value.trim(),d:$('#sd').value.trim(),g:$('#sg').value}])}catch(e){toast('Hata: '+e.message)}}
async function slMove(i,k){const L=[...ST.sl],j=i+k;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];try{await slSave(L)}catch(e){toast('Hata: '+e.message)}}
async function slDel(i){if(!confirm('Slayt silinsin mi?'))return;const L=[...ST.sl],x=L.splice(i,1)[0];try{await delDocs(['cfg/si_'+x.id]);await slSave(L)}catch(e){toast('Hata: '+e.message)}}

const OFFS=[['club','Teori Köşesi'],['feed','Fan Akışı']],MODS=['practice','duel','daily','sudden','chal','s1','s2','ep'];
async function ayGet(){const d=await api(FB+'/cfg/app'),f=d&&d.fields?d.fields:{},t=await api(FB+'/cfg/tp');ST.ay={ann:nv(f.ann)||'',annOn:!!nv(f.annOn),mt:!!nv(f.mt),mtMsg:nv(f.mtMsg)||'',off:(nv(f.off)||'').split(',')};ST.tp=t&&t.fields?{t:nv(t.fields.t)||'',x:nv(t.fields.x)||''}:{t:'',x:''}}
function ayView(){const a=ST.ay||{};return`<div class="c"><b>📢 Duyuru (ana sayfada görünür)</b><input id="an" maxlength="140" value="${esc(a.ann)}" placeholder="Duyuru metni"><label><input type="checkbox" id="ao" ${a.annOn?'checked':''}> Duyuru açık</label></div><div class="c"><b>🛠️ Bakım modu</b><input id="mm" maxlength="140" value="${esc(a.mtMsg)}" placeholder="Bakım mesajı"><label><input type="checkbox" id="mo" ${a.mt?'checked':''}> Bakım modu AÇIK (herkesin ekranını kapatır)</label></div><div class="c"><b>🔒 Bölümü kapat</b>${OFFS.map(o=>`<label style="display:block"><input type="checkbox" class="of" value="${o[0]}" ${(a.off||[]).includes(o[0])?'checked':''}> ${o[1]} kapalı</label>`).join('')}</div><button onclick="aySave()">Kaydet</button><div class="c" style="margin-top:12px"><b>📌 Haftanın konusu (Teori Köşesi)</b><input id="tt" maxlength="100" value="${esc((ST.tp||{}).t)}" placeholder="Konu başlığı"><textarea id="tx2" maxlength="300" rows="2" placeholder="Kısa açıklama">${esc((ST.tp||{}).x)}</textarea><button onclick="tpSave()">Konuyu yayınla</button></div>`}
async function aySave(){try{await setDoc('cfg/app',{ann:fS($('#an').value.trim()),annOn:fB($('#ao').checked),mt:fB($('#mo').checked),mtMsg:fS($('#mm').value.trim()),off:fS([...document.querySelectorAll('.of:checked')].map(x=>x.value).join(','))});toast('✅ Kaydedildi (uygulama 5 dk içinde alır)')}catch(e){toast('Hata: '+e.message)}}
async function tpSave(){try{await setDoc('cfg/tp',{t:fS($('#tt').value.trim()),x:fS($('#tx2').value.trim())});toast('✅ Konu yayında')}catch(e){toast('Hata: '+e.message)}}
async function qxGet(){const d=await api(FB+'/cfg/qx');ST.qx=d&&d.fields?JSON.parse(nv(d.fields.l)||'[]'):[]}
function qxView(){return`<div class="c"><b>Yeni soru</b><input id="q0" maxlength="160" placeholder="Soru"><input id="q1" maxlength="80" placeholder="✅ Doğru cevap"><input id="q2" maxlength="80" placeholder="Yanlış 1"><input id="q3" maxlength="80" placeholder="Yanlış 2"><input id="q4" maxlength="80" placeholder="Yanlış 3"><select id="q5">${MODS.map(m=>`<option>${m}</option>`).join('')}</select><button onclick="qxAdd()">Ekle</button><div class="s">Yalnızca kesin bildiğin dizi bilgilerini ekle. ${(ST.qx||[]).length} ek soru var.</div></div>${(ST.qx||[]).map((r,i)=>`<div class="c">${esc(r.q)}<div class="s">✅ ${esc(r.a)} · ${esc((r.w||[]).join(' / '))} · ${esc(r.m)}</div><button class="d" onclick="qxDel(${i})">Sil</button></div>`).join('')}`}
async function qxSave(L){await setDoc('cfg/qx',{l:fS(JSON.stringify(L))});ST.qx=L;draw()}
async function qxAdd(){const v=i=>$('#q'+i).value.trim(),r={q:v(0),a:v(1),w:[v(2),v(3),v(4)],m:v(5)};if(!r.q||!r.a||r.w.some(x=>!x))return toast('Hepsini doldur');if((ST.qx||[]).length>=300)return toast('En fazla 300');try{await qxSave([...(ST.qx||[]),r]);toast('✅ Eklendi')}catch(e){toast('Hata: '+e.message)}}
async function qxDel(i){if(!confirm('Soru silinsin mi?'))return;const L=[...ST.qx];L.splice(i,1);try{await qxSave(L)}catch(e){toast('Hata: '+e.message)}}
async function stGet(){const n=async(c)=>{try{return(await fq('',c,{limit:300})).length}catch(e){return'?'}};ST.st={u:await n('users'),p:await n('posts'),r:await n('rp')}}
function stView(){const s=ST.st||{};return`<div class="c"><b>📊 Durum</b><div>👥 Kayıtlı oyuncu: ${s.u} (en fazla 300 sayılır)</div><div>🎬 Paylaşım: ${s.p}</div><div>🚩 Bekleyen şikâyet: ${s.r}</div></div>`}
(async()=>{if(sessionStorage.rt){try{await auth();await boot();return}catch(e){}}view()})();
</script></body></html>
