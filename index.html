0&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--sea-dark:#07111f;--gold:#c9953a;--gold-light:#e8c06b;--foam:#8bc8e8;}\n  *{margin:0;padding:0;box-sizing:border-box;}\n  body{min-height:100vh;background:var(--sea-dark);font-family:'Crimson Pro',serif;overflow-x:hidden;}\n  .sea-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 10%,#0b3060 0%,#040c18 65%);overflow:hidden;}\n  .wave{position:absolute;bottom:0;left:-50%;width:200%;height:110px;background:repeating-linear-gradient(90deg,transparent,transparent 30px,rgba(33,118,174,.07) 30px,rgba(33,118,174,.07) 60px);border-radius:50% 50% 0 0/20px 20px 0 0;animation:wv 9s linear infinite;}\n  .wave:nth-child(2){bottom:14px;opacity:.5;animation-duration:13s;animation-direction:reverse;}\n  .wave:nth-child(3){bottom:28px;opacity:.25;animation-duration:7s;}\n  @keyframes wv{from{transform:translateX(0)}to{transform:translateX(25%)}}\n  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}\n  .star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;}\n  @keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.9;transform:scale(1.5)}}\n  .wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 10px 28px;}\n  .header{text-align:center;margin-bottom:14px;}\n  .tag{font-size:10px;letter-spacing:4px;color:var(--foam);text-transform:uppercase;opacity:.7;margin-bottom:3px;}\n  .title{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(20px,5.5vw,30px);color:var(--gold-light);text-shadow:0 0 28px rgba(201,149,58,.5);letter-spacing:1px;line-height:1.1;}\n  .subtitle{font-family:'Cinzel',serif;font-size:clamp(10px,2.2vw,13px);color:var(--foam);letter-spacing:3px;opacity:.65;margin-top:3px;}\n  .divider{width:110px;height:2px;margin:8px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);}\n  .stats{display:flex;gap:18px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid rgba(201,149,58,.2);border-radius:50px;padding:7px 22px;backdrop-filter:blur(8px);}\n  .stat{display:flex;flex-direction:column;align-items:center;gap:1px;}\n  .stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--foam);opacity:.55;}\n  .stat-val{font-family:'Cinzel',serif;font-size:17px;font-weight:600;color:var(--gold-light);}\n  .sep{width:1px;height:34px;background:rgba(201,149,58,.2);}\n  .tbar-wrap{width:100%;max-width:460px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:10px;}\n  .tbar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--foam));transition:width 1s linear,background .5s;}\n  .tbar.warn{background:linear-gradient(90deg,#e84545,#ff8c42);}\n  .grid{display:grid;gap:7px;width:100%;max-width:460px;}\n  .card{aspect-ratio:2/3;perspective:900px;cursor:pointer;}\n  .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:10px;}\n  .card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg);}\n  .face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}\n  .back{background:linear-gradient(145deg,#0d2a4a,#06101c);border:1px solid rgba(201,149,58,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}\n  .back::before{content:'';position:absolute;inset:4px;border:1px solid rgba(201,149,58,.12);border-radius:7px;}\n  .back-ring{width:36px;height:36px;border-radius:50%;border:2px solid rgba(201,149,58,.3);box-shadow:0 0 12px rgba(201,149,58,.15);display:flex;align-items:center;justify-content:center;font-size:16px;}\n  .back-lbl{font-family:'Cinzel',serif;font-size:6px;letter-spacing:1.5px;color:rgba(201,149,58,.4);text-transform:uppercase;}\n  .front{transform:rotateY(180deg);background:#0a1c30;border:1px solid rgba(201,149,58,.22);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;}\n  .front::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 48%,rgba(0,0,0,.88) 100%);pointer-events:none;}\n  .photo{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:top center;background-repeat:no-repeat;}\n  .char-name{position:relative;z-index:1;font-family:'Cinzel',serif;font-size:8.5px;font-weight:600;color:var(--gold-light);text-align:center;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.3;padding:0 3px;}\n  .char-actor{position:relative;z-index:1;font-size:7px;color:rgba(190,210,235,.65);text-align:center;font-style:italic;line-height:1.2;}\n  .badge{position:absolute;top:4px;right:4px;z-index:2;font-size:5.5px;letter-spacing:.7px;text-transform:uppercase;padding:2px 4px;border-radius:3px;font-family:'Cinzel',serif;}\n  .badge.k{background:rgba(26,58,92,.88);color:var(--gold-light);border:1px solid rgba(201,149,58,.35);}\n  .badge.f{background:rgba(50,10,10,.88);color:#e99;border:1px solid rgba(180,50,50,.35);}\n  .badge.d{background:rgba(10,35,30,.88);color:#8de;border:1px solid rgba(50,160,120,.35);}\n  .card.matched .front{border-color:var(--gold);box-shadow:0 0 18px rgba(201,149,58,.5);}\n  .card.matched .card-inner{animation:pulse .45s ease-out;}\n  @keyframes pulse{0%{transform:rotateY(180deg) scale(1);}40%{transform:rotateY(180deg) scale(1.08);}100%{transform:rotateY(180deg) scale(1);}}\n  .card.shake .card-inner{animation:shake .38s ease-out;}\n  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}20%{transform:rotateY(180deg) translateX(-5px);}60%{transform:rotateY(180deg) translateX(5px);}}\n  .btn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--sea-dark);background:linear-gradient(135deg,var(--gold-light),var(--gold));border:none;border-radius:50px;padding:11px 30px;cursor:pointer;margin-top:14px;box-shadow:0 4px 18px rgba(201,149,58,.38);transition:transform .15s;}\n  .btn:active{transform:scale(.96);}\n  .overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(4,10,20,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px;}\n  .overlay.show{display:flex;}\n  .ov-icon{font-size:56px;margin-bottom:10px;}\n  .ov-title{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(22px,6vw,34px);color:var(--gold-light);text-shadow:0 0 28px rgba(201,149,58,.55);margin-bottom:7px;}\n  .ov-sub{font-size:15px;color:var(--foam);opacity:.8;font-style:italic;margin-bottom:5px;}\n  .ov-stat{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:3px;}\n  .diff-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;justify-content:center;}\n  .dbtn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;color:var(--foam);background:rgba(255,255,255,.04);border:1px solid rgba(201,149,58,.25);border-radius:50px;padding:7px 16px;cursor:pointer;transition:all .2s;line-height:1.6;}\n  .dbtn.on,.dbtn:hover{background:rgba(201,149,58,.18);border-color:var(--gold);color:var(--gold-light);}\n<\/style>\n<\/head>\n<body>\n<div class=\"sea-bg\"><div class=\"wave\"><\/div><div class=\"wave\"><\/div><div class=\"wave\"><\/div><\/div>\n<div class=\"stars\" id=\"stars\"><\/div>\n<div class=\"wrapper\">\n  <div class=\"header\">\n    <div class=\"tag\">TRT 1 ✦ Karadeniz<\/div>\n    <div class=\"title\">Taşacak Bu Deniz<\/div>\n    <div class=\"subtitle\">Kart Eşleştirme Oyunu<\/div>\n    <div class=\"divider\"><\/div>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><span class=\"stat-lbl\">Hamle<\/span><span class=\"stat-val\" id=\"moves\">0<\/span><\/div>\n    <div class=\"sep\"><\/div>\n    <div class=\"stat\"><span class=\"stat-lbl\">Eşleşen<\/span><span class=\"stat-val\" id=\"matched\">0<\/span><\/div>\n rine inanmak zorundasın.',\n    adilLabel: '\"Şerif\\'in hedefi Furtunalılar, güven bana.\"',\n    esmeLabel: '\"Adil yanılıyor, tehlike Koçariler\\'in içinden geliyor.\"',\n    communityAdil: 52, communityEsme: 48,\n    furtunaAdil: 35, kocarAdil: 68,\n    comments: [\n      { side:'adil', text:'Adil kendi ailesini daha iyi tanır.' },\n      { side:'esme', text:'Esme hiç yalan söylemedi ki — Adil\\'e körü körüne inanmak tehlikeli.' },\n    ]\n  },\n  {\n    category: '💔 ZOR KARAR',\n    text: 'Adil ve Esme\\'nin birlikteliğini bitirmek sende. Ne yaparsın?',\n    context: 'Eski bir sır ortaya çıktı. Bu ikisinin bir arada olması Koçari ve Furtuna\\'yı yıkabilir. Ama ayırırsan ikisi de yıkılır. Seçim senin.',\n    adilLabel: 'Adil\\'in kararını destekle, birlikte olsunlar.',\n    esmeLabel: 'Esme\\'yi koru, ayrılmaları daha iyi.',\n    communityAdil: 71, communityEsme: 29,\n    furtunaAdil: 65, kocarAdil: 78,\n    comments: [\n      { side:'adil', text:'Bu aşkı kimse durduramaz, destekliyorum.' },\n      { side:'esme', text:'Esme\\'nin huzuru her şeyden önce gelir.' },\n    ]\n  },\n  {\n    category: '⚔️ HANGİ TARAFTA?',\n    text: 'Savaş başlıyor. Hangisinin safına geçersin?',\n    context: 'Koçariler ve Furtunalılar arasında büyük hesaplaşma başlıyor. Tarafsız kalamazsın — birine destek vermek zorundasın.',\n    adilLabel: '👑 Adil\\'le — Koçariler safında.',\n    esmeLabel: '🌊 Esme\\'yle — barış için mücadele.',\n    communityAdil: 45, communityEsme: 55,\n    furtunaAdil: 22, kocarAdil: 82,\n    comments: [\n      { side:'esme', text:'Esme barış için savaşıyor, bu daha cesur!' },\n      { side:'adil', text:'Koçariler haklı — onların safındayım.' },\n    ]\n  },\n  {\n    category: '🔮 SON KARAR',\n    text: 'Şerif\\'in sırrını biliyorsun. Kime söylersin?',\n    context: '22. bölümün sonunda Şerif\\'in tüm planı sende. Adil\\'e söylersen Esme tehlikeye girer. Esme\\'ye söylersen Adil\\'i riske atarsın.',\n    adilLabel: 'Adil\\'e söyle — güç onun elinde olsun.',\n    esmeLabel: 'Esme\\'ye söyle — o daha akıllıca kullanır.',\n    communityAdil: 33, communityEsme: 67,\n    furtunaAdil: 30, kocarAdil: 40,\n    comments: [\n      { side:'esme', text:'Esme duygusal değil, stratejik düşünür.' },\n      { side:'adil', text:'Adil liderdir, bu bilgi onda kalmalı.' },\n    ]\n  },\n];\n\nlet current = 0;\nlet answers = [];\nlet userChoice = null;\n\nfunction init() {\n  buildProgress();\n  loadQuestion(0);\n}\n\nfunction buildProgress() {\n  const row = document.getElementById('progressRow');\n  row.innerHTML = '';\n  QUESTIONS.forEach((_, i) => {\n    const d = document.createElement('div');\n    d.className = 'progress-dot' + (i===current?' active':'') + (i<current?' done':'');\n    row.appendChild(d);\n  });\n}\n\nfunction loadQuestion(idx) {\n  const q = QUESTIONS[idx];\n  document.getElementById('qNumber').textContent = `SORU ${idx+1} / ${QUESTIONS.length}`;\n  document.getElementById('qCategory').textContent = q.category;\n  document.getElementById('qText').textContent = q.text;\n  document.getElementById('qContext').textContent = q.context;\n  document.getElementById('adilLabel').textContent = q.adilLabel;\n  document.getElementById('esmeLabel').textContent = q.esmeLabel;\n\n  document.getElementById('questionWrap').style.display = 'block';\n  document.getElementById('resultPanel').classList.remove('show');\n  document.getElementById('finalScreen').classList.remove('show');\n  document.getElementById('commentsList').innerHTML = '';\n  document.getElementById('commentInput').value = '';\n\n  const card = document.getElementById('qCard');\n  card.style.animation = 'none';\n  void card.offsetWidth;\n  card.style.animation = 'cardIn 0.5s cubic-bezier(.34,1.2,.64,1) both';\n\n  buildProgress();\n}\n\nfunction choose(side) {\n  userChoice = side;\n  answers.push(side);\n\n  const q = QUESTIONS[current];\n  const totalAdil = q.communityAdil + (side==='adil'?1:0);\n  const totalEsme = q.communityEsme + (side==='esme'?1:0);\n  const total = totalAdil + totalEsme;\n  const pAdil = Math.round(totalAdil/total*100);\n  const pEsme = 100 - pAdil;\n\n  document.getElementById('questionWrap').style.display = 'none';\n  const rp = document.getElementById('resultPanel');\n  rp.classList.add('show');\n  rp.style.animation = 'none'; void rp.offsetWidth;\n  rp.style.animation = 'resultIn 0.6s cubic-bezier(.34,1.2,.64,1) both';\n\n  setTimeout(() => {\n    document.getElementById('barAdil').style.width = pAdil+'%';\n    document.getElementById('barEsme').style.width = pEsme+'%';\n  }, 80);\n\n  document.getElementById('adilPct').textContent = pAdil+'%';\n  document.getElementById('esmePct').textContent = pEsme+'%';\n\n  const fa = q.furtunaAdil, fe = 100-fa;\n  const ka = q.kocarAdil,   ke = 100-ka;\n  setTimeout(() => {\n    document.getElementById('furtuna-adil-bar').style.width = fa+'%';\n    document.getElementById('kocar-adil-bar').style.width = ka+'%';\n  }, 300);\n  document.getElementById('furtuna-adil-pct').textContent = fa+'% Adil';\n  document.getElementById('furtuna-esme-pct').textContent = fe+'% Esme';\n  document.getElementById('kocar-adil-pct').textContent   = ka+'% Adil';\n  document.getElementById('kocar-esme-pct').textContent   = ke+'% Esme';\n\n  const isMinority = (side==='adil' && pAdil<50) || (side==='esme' && pEsme<50);\n  document.getElementById('pickIcon').textContent = side==='adil' ? '👑' : '🌊';\n  document.getElementById('pickName').textContent = side==='adil' ? 'Adil Koçari' : 'Esme Furtuna';\n  document.getElementById('pickMinority').textContent = isMinority\n    ? `🎖️ Azınlıktasın — sadece %${side==='adil'?pAdil:pEsme} bu seçimi yaptı!`\n    : `Topluluğun %${side==='adil'?pAdil:pEsme}'i seninle aynı düşünüyor.`;\n\n  const cl = document.getElementById('commentsList');\n  q.comments.forEach(c => addCommentEl(cl, c.side, c.text, false));\n\n  const sideStr = side==='adil' ? 'Adil' : 'Esme';\n  const pctStr  = side==='adil' ? pAdil : pEsme;\n  document.getElementById('shareQuote').textContent =\n    `\"${q.text}\" sorusunda ${sideStr} seçtim — topluluğun %${pctStr}'iyle aynı taraftayım! Peki sen?`;\n\n  const isLast = current === QUESTIONS.length - 1;\n  document.getElementById('nextBtn').textContent = isLast ? 'SONUÇLARI GÖR ›' : 'SONRAKİ SORU ›';\n}\n\nfunction addCommentEl(container, side, text, animate=true) {\n  const div = document.createElement('div');\n  div.className = 'comment-item';\n  if (!animate) div.style.animation = 'none';\n  div.innerHTML = `\n    <div class=\"comment-side-dot\" style=\"background:${side==='adil'?'#e86060':'#6090e8'}\"><\/div>\n    <div>\n      <div class=\"comment-author\">${side==='adil'?'👑 Adil Tarafı':'🌊 Esme Tarafı'}<\/div>\n      <div class=\"comment-text\">${text}<\/div>\n    <\/div>\n  `;\n  container.appendChild(div);\n}\n\nfunction sendComment() {\n  const inp = document.getElementById('commentInput');\n  const val = inp.value.trim();\n  if (!val) return;\n  const cl = document.getElementById('commentsList');\n  addCommentEl(cl, userChoice, val);\n  inp.value = '';\n  showToast('Yorumun eklendi! 💬');\n}\n\ndocument.addEventListener('keydown', e => {\n  if (e.key==='Enter' && document.activeElement.id==='commentInput') sendComment();\n});\n\nfunction nextQuestion() {\n  const isLast = current === QUESTIONS.length - 1;\n  if (isLast) { showFinal(); return; }\n  current++;\n  loadQuestion(current);\n}\n\nfunction copyShare() {\n  const text = document.getElementById('shareQuote').textContent;\n  const full = text + '\\n\\nTaşacak Bu Deniz Fan Quiz Arena\\'da oyna! 🌊';\n  navigator.clipboard.writeText(full).then(() => showToast('Kopyalandı! 📋')).catch(() => showToast('Metni seçip kopyalayabilirsin.'));\n}\n\nfunction showFinal() {\n  document.getElementById('resultPanel').classList.remove('show');\n  document.getElementById('questionWrap').style.display='none';\n\n  const fs = document.getElementById('finalScreen');\n  fs.classList.add('show');\n\n  const adilCount = answers.filter(a=>a==='adil').length;\n  const esmeCount = answers.filter(a=>a==='esme').length;\n  const adilPct = Math.round(adilCount/answers.length*100);\n  const esmePct = 100-adilPct;\n\n  document.getElementById('finalSummary').innerHTML = `\n    <div class=\"result-summary-card adil-card\">\n      <div class=\"rsc-name adil\">ADİL<\/div>\n      <div class=\"rsc-pct adil\">${adilCount}/${answers.length}<\/div>\n      <div class=\"rsc-label\">soruda Adil\\'i seçtin<\/div>\n    <\/div>\n    <div class=\"result-summary-card esme-card\">\n      <div class=\"rsc-name esme\">ESME<\/div>\n      <div class=\"rsc-pct esme\">${esmeCount}/${answers.length}<\/div>\n      <div class=\"rsc-label\">soruda Esme\\'yi seçtin<\/div>\n    <\/div>\n  `;\n\n  let verdict = '';\n  if (adilCount === answers.length) {\n    verdict = '👑 Tam bir Koçari sadakati! Sen Adil\\'in en büyük destekçisisin. Güç ve onur senin için her şeyin önünde.';\n  } else if (esmeCount === answers.length) {\n    verdict = '🌊 Esme\\'nin izinden yürüyorsun. Dalgalar gibi — bazen sert, ama her zaman gerçek. Karadeniz\\'in ruhu sende.';\n  } else if (adilCount > esmeCount) {\n    verdict = `👑 Ağırlıklı olarak Adil tarafındasın (%${adilPct}). Güce ve kararlılığa inanıyorsun ama bazen Esme\\'nin sesini de duyuyorsun.`;\n  } else {\n    verdict = `🌊 Ağırlıklı olarak Esme tarafındasın (%${esmePct}). Duygularına güveniyorsun, ama zor anlarda da mantığı elden bırakmıyorsun.`;\n  }\n\n  document.getElementById('finalVerdict').textContent = verdict;\n  try{parent.postMessage({adil:1,n:answers.length},'*')}catch(e){}\n  buildProgress();\n}\n\nfunction restart() {\n  current = 0;\n  answers = [];\n  userChoice = null;\n  document.getElementById('finalScreen').classList.remove('show');\n  loadQuestion(0);\n  document.getElementById('questionWrap').style.display='block';\n}\n\nfunction showToast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 2500);\n}\n\ninit();\n<\/script>\n\n<\/body>\n<\/html>\n";

akta. Esme'yi bırak!\"],[\"serif\",\"Vicdan mı? Hadi bakalım, yetişebilirsen yetiş!\"]],\neyuphan:[[\"serif\",\"Eyüphan... Adil seni kapı dışarı etti. Bana katıl, intikamını alırsın.\"],[\"me\",\"Adil'le hesabım ayrı. Ama köyün suyunu zehirleyene ortak olmam!\"],[\"serif\",\"Gurur sana ne verdi? Kapı dışarı edilmişsin.\"],[\"me\",\"Vicdanım bana yetiyor. Esme'yi bırak!\"],[\"serif\",\"Pişman olacaksın Eyüphan. Ben giderim!\"]],\ngokhan:[[\"serif\",\"Gökhan... Bu işi birlikte bitirecektik, hatırlıyor musun?\"],[\"me\",\"Köyün suyunu zehirlemek anlaşmamızda yoktu Şerif! Bu çok ileri gitti.\"],[\"serif\",\"Sen ileri gitmeyi bilmezsin. Ben bilirim.\"],[\"me\",\"Esme'yi ve esirleri bırakacaksın!\"],[\"serif\",\"Bırakacak mıyım? Yetişirsen göreceksin!\"]],\ncakir:[[\"serif\",\"Çakır... Sen de mi karşıma çıktın? Bu köyün derdi sana ne?\"],[\"me\",\"Köyün suyunu zehirleyen, depoyu yakan sensin. Bunu herkes bilecek!\"],[\"serif\",\"Kanıt yok Çakır. Kanıt isterler, kanıt bende değil.\"],[\"me\",\"Esme'yi ve esirleri bırak, yoksa tüm köy peşine düşer!\"],[\"serif\",\"Peşime mi? Görürüz. Ben giderim!\"]]\n};\nvar GOALS={esme:\"Şerif'in adamlarından kaç! Esirleri kurtar, Adil'e ulaş!\"};\n/* ---------- YENI SENARYO SISTEMI: karakter baglari ---------- */\nvar FAMF={esme:1,oruc:1,iso:1,zarife:1,sirin:1,gokhan:1,serif:1},FAMK={adil:1,fadime:1,gezep:1,eyuphan:1,cakir:1};\nvar DEAR={\nesme:['adil','eleni','oruc','zarife'],adil:['esme','eleni','fadime','gezep'],eleni:['oruc','adil','esme','zarife'],\noruc:['eleni','esme','iso','zarife'],iso:['oruc','zarife','esme','eleni'],zarife:['oruc','iso','eleni','sirin'],\nsirin:['oruc','iso','zarife','esme'],gezep:['adil','fadime','eyuphan','cakir'],fadime:['adil','gezep','eleni','eyuphan'],\neyuphan:['adil','gezep','fadime','cakir'],gokhan:['zarife','oruc','iso','esme'],cakir:['adil','gezep','fadime','eyuphan']};\nvar TIE={\nesme:{adil:\"yıllardır özlediğin aşkın Adil\",eleni:\"kızın Eleni\",oruc:\"sana “yenge” diyen Oruç\",zarife:\"yengen Zarife\",iso:\"yeğenin gibi gördüğün İso\",sirin:\"kayınvalidene benzeyen Şirin\"},\nadil:{esme:\"yıllardır unutamadığın Esme\",eleni:\"hayatını kurtaran kızın Eleni\",fadime:\"kız kardeşin Fadime\",gezep:\"kuzenin Gezep\",eyuphan:\"Koçari'den Eyüphan\",cakir:\"Koçari'den Çakır\"},\neleni:{oruc:\"sana gönlünü kaptıran Oruç\",adil:\"babanın yerini tutan Adil\",esme:\"annen Esme\",zarife:\"seni evlat edinen Zarife\",iso:\"evlatlık kardeşin İso\"},\noruc:{eleni:\"gönlünü verdiğin Eleni\",esme:\"yengen Esme\",iso:\"kardeşin İso\",zarife:\"annen Zarife\",sirin:\"büyükannen Şirin\"},\niso:{oruc:\"ağabeyin Oruç\",zarife:\"annen Zarife\",esme:\"yengen Esme\",eleni:\"evlatlık kardeşin Eleni\",sirin:\"büyükannen Şirin\"},\nzarife:{oruc:\"oğlun Oruç\",iso:\"oğlun İso\",eleni:\"evlat edindiğin Eleni\",sirin:\"ailenin büyüğü Şirin\",esme:\"Furtuna'nın gelini Esme\"},\nsirin:{oruc:\"torunun Oruç\",iso:\"torunun İso\",zarife:\"gelinin Zarife\",esme:\"gelinin Esme\",eleni:\"Furtuna'ya gelen Eleni\"},\ngezep:{adil:\"kuzenin Adil\",fadime:\"kuzenin Fadime\",eyuphan:\"Koçari'den Eyüphan\",cakir:\"Koçari'den Çakır\"},\nfadime:{adil:\"ağabeyin Adil\",gezep:\"kuzenin Gezep\",eleni:\"Adil'i kurtaran Eleni\",eyuphan:\"Koçari'den Eyüphan\"},\neyuphan:{adil:\"Koçari'nin yiğidi Adil\",gezep:\"kuzenin Gezep\",fadime:\"Koçari'nin kızı Fadime\",cakir:\"Koçari'den Çakır\"},\ngokhan:{zarife:\"patronun Zarife Hanım\",oruc:\"koruduğun Oruç\",iso:\"koruduğun İso\",esme:\"Furtuna'nın gelini Esme\"},\ncakir:{adil:\"Koçari'nin yiğidi Adil\",gezep:\"Koçari'den Gezep\",fadime:\"Koçari'nin kızı Fadime\",eyuphan:\"Koçari'den Eyüphan\"}};\nfunction tie(a,b){\nvar t=TIE[a]&&TIE[a][b];if(t)return t;\nreturn (FAMF[b]?\"Furtuna'dan \":(FAMK[b]?\"Koçari'den \":\"\"))+ROLES[b].k;\n}\nfunction capTR(s){return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1);}\nfunction relCat(a,b){\nvar pr=function(x,y){return (a===x&&b===y)||(a===y&&b===x);};\nif(pr('esme','adil'))return 'lover';\nif(a==='eleni'&&(b==='esme'||b==='adil'))return 'parent';\nif(b==='eleni'&&(a==='esme'||a==='adil'))return 'child';\nif((a==='zarife'||a==='sirin')&&(b==='oruc'||b==='iso'))return 'child';\nif((b==='zarife'||b==='sirin')&&(a==='oruc'||a==='iso'))return 'parent';\nif(a==='sirin'&&b==='zarife'||a==='zarife'&&b==='sirin')return 'kin';\nif(pr('oruc','iso')||pr('adil','fadime'))return 'sibling';\nif(pr('adil','gezep')||pr('gezep','fadime')||pr('adil','eyuphan')||pr('gezep','eyuphan'))return 'cousin';\nif(pr('oruc','eleni'))return 'crush';\nif(pr('iso','eleni'))return 'foster';\nif(a==='gokhan'&&FAMF[b]||b==='gokhan'&&FAMF[a])return 'guard';\nif(FAMF[a]&&FAMK[b]||FAMK[a]&&FAMF[b])return 'feud';\nif(a==='eleni'||b==='eleni')return 'friend';\nreturn 'kin';\n}\nfunction genReact(h,r){\nvar c=relCat(r,h),fh=FAMF[h]?\"Furtuna\":(FAMK[h]?\"Koçari\":\"\");\nvar m={\nlover:[[\"h\",\"Sen... Yine beni buldun.\"],[\"r\",\"Seni bir daha kaybetmeyeceğim. Kaç yıl geçse de.\"],[\"h\",\"Aramızdaki bu kadar şeye rağmen mi?\"],[\"r\",\"Hepsine rağmen. Hadi, çıkalım buradan.\"]],\nparent:[[\"h\",\"Evladım... Sen benim için buraya kadar geldin?\"],[\"r\",\"Senin için dünyayı yakarım. Güvendesin.\"]],\nchild:[[\"h\",\"Sen geldin... Çok korkmuştum.\"],[\"r\",\"Artık güvendesin. Ben yanındayım.\"]],\nsibling:[[\"h\",\"Biliyordum, beni bırakmazdın.\"],[\"r\",\"Kardeşim kardeşimdir. Gel, birlikte bitirelim.\"]],\ncousin:[[\"h\",\"Kan bağı denen bu işte... Sağ ol.\"],[\"r\",\"Aile aile içindir. Şerif'i durduracağız.\"]],\ncrush:[[\"h\",\"Beni bulacağını biliyordum... Sen hep zamanında gelirsin.\"],[\"r\",\"Bundan sonra yanından ayrılmayacağım.\"]],\nfoster:[[\"h\",\"Aynı sofrada büyüdük... Sağ ol.\"],[\"r\",\"Hadi, sonra konuşuruz. Önce çıkalım.\"]],\nguard:[[\"h\",\"Sen mi? Hizmetten fazlasını yaptın.\"],[\"r\",\"Koruduğum insanlar için yaparım. Gel.\"]],\nfeud:[[\"h\",\"Bir \"+(FAMK[r]?\"Koçari\":\"Furtuna\")+\" beni kurtarıyor... Bunu unutmam.\"],[\"r\",\"Kan davası ayrı, can ayrı. Yürü.\"]],\nfriend:[[\"h\",\"Sağ ol... Sen olmasan çıkamazdım.\"],[\"r\",\"Birlikte çıkacağız buradan.\"]],\nkin:[[\"h\",\"Aile her şeyden önce gelir. Sağ ol.\"],[\"r\",\"Birlikte bitireceğiz.\"]]};\nreturn m[c];\n}\nvar STAND={\nesme:{m:[\"Adil'e bir kez kıydım, bir ömür pişman oldum. Bir daha asla!\",\"Kâğıt üstünde karınım dersin ama ben senin hiçbir şeyin değilim.\",\"Furtuna'nın gelini olarak değil, kendi adıma geldim.\"],\ns:[\"Karım... Hâlâ bana ait olduğunu sanıyorsun.\",\"Adil'e bir kurşun yetmedi mi sana?\",\"Hapisten çıktım Esme. Bu oyunun kurallarını ben yazarım.\"]},\nadil:{m:[\"Furtuna'yla davamız bitmedi Şerif ama bu yaptığın kan davası bile değil!\",\"Esme'ye ve kızıma dokunursan bu denizi senin üstüne taşırırım!\",\"Koçari bir kere söz verdi mi geri adım atmaz.\"],\ns:[\"Bir kurşunla ölmedin Adil. Ama bir daha ölmeyeceksin diye kural yok.\",\"Esme'yi sevmek sana pahalıya mal olacak.\",\"Kan davası eski bir satranç Adil; ben hep iki hamle ilerideyim.\"]},\neleni:{m:[\"Ben bir sırrın peşinde geldim Şerif. Sen de o sırrı biliyorsun!\",\"Doktorun yemini var: kimseyi ölüme terk etmem. Seni bile.\",\"Adil'in hayatını kurtardım. Şimdi sıra diğerlerinde.\"],\ns:[\"Yunan doktor... Bu topraklara sır avına geldin ama sırlar pahalıdır.\",\"Sırrı öğrenirsen geri dönüşü yok Eleni.\",\"İki düşman ailenin arasında ne arıyorsun?\"]},\noruc:{m:[\"Amca, bu kadar mı? Aile kanıyla oyun mu oynuyorsun?\",\"Hem savaşırım hem iyileştiririm. İkisini de senin için bırakmam!\",\"Eleni'ye zarar verirsen amcam olduğunu unuturum.\"],\ns:[\"Yeğenim... Kılıcınla mı şifanla mı geleceksin?\",\"Furtuna'nın kanı Furtuna'ya karşı mı akacak?\",\"Sen de annen gibi oyunumun bir taşısın Oruç.\"]},\niso:{m:[\"Amca, sende hâlâ iyi bir yan olduğuna inanıyordum. Yanılmışım!\",\"Bana sana benziyorsun derler. Ben sana benzemeyeceğim!\",\"Ağabeyime ve ailemize dokunamazsın!\"],\ns:[\"İso... Bana en çok benzeyen yeğenim. Yanıma gel.\",\"İyi yürek bu oyunda piyondur İso.\",\"Kanın beni çağıracak, göreceksin.\"]},\nzarife:{m:[\"Ailem için her şeyi yaptım Şerif ama bu çocuklara dokunamazsın!\",\"Yengen olarak söylüyorum: bu kadar ileri gitme!\",\"Sırlarımı biliyorsun. Ama benim de senin sırların var.\"],\ns:[\"Yenge... Sırlarımızı birlikte taşıyorduk, unuttun mu?\",\"Sen de benim kadar ellerini kirlettin Zarife.\",\"Bana karşı mı duracaksın? Aile bu mu?\"]},\nsirin:{m:[\"Ben senin annenim Şerif. Beni dinle, çocuklara dokunma!\",\"Bu aileyi sen bitiriyorsun oğlum!\",\"Bir anne yüreği kaç kez kanar Şerif?\"],\ns:[\"Anne... Beni sen böyle yaptın.\",\"Ailenin büyüğü sensin ama bu oyunun büyüğü benim.\",\"Karışma anne. Bu satranç bana ait.\"]},\ngezep:{m:[\"Öfkemi yanlış yere harcadım. Bu kez doğru yere harcayacağım!\",\"Hatalarımı Adil'e kardeşim gibi bağlanarak telafi edeceğim!\",\"Öfkem artık senin başına yağacak Şerif!\"],\ns:[\"Gezep... En sinirli Koçari. Öfken benim silahım.\",\"Hataların beni sever Gezep.\",\"Senin gibi sinirli birini yönetmek kolay.\"]},\nfadime:{m:[\"Abim Adil'in yanında olacağım, kimse beni durduramaz!\",\"Koçari kızı korkmaz Şerif!\",\"Kaybolduğumda beni bulan oldu. Şimdi ben buluyorum!\"],\ns:[\"Küçük Koçari... Kaybolmuşken daha uslu duruyordun.\",\"Abin seni kurtaramadı, sen kimi kurtaracaksın?\",\"Koçari'nin en genç piyonu.\"]},\neyuphan:{m:[\"Babam Amirum Dayı'nın öğüdü: Koçari asla sırtını dönmez!\",\"Adil'le aramızda ne olursa olsun ailem ailemdir!\",\"Seni ileri götürmeyeceğim Şerif.\"],\ns:[\"Amirum Dayı'nın oğlu... Bilgenin gölgesi.\",\"Babanın öğütleri kaç can kurtardı?\",\"Aklın var Eyüphan ama cesaretin?\"]},\ngokhan:{m:[\"Zarife Hanım'ın korumasıyım. Senin emirlerin geçmez Şerif!\",\"Silah tutan eller artık doğru tarafı tutacak!\",\"Koruduğum insanlara dokunamazsın!\"],\ns:[\"Gökhan... Koruma dediğin kimin için ölür?\",\"Zarife'yi senden kimse koruyamaz.\",\"Bir hizmetkârın cesareti ne kadar sürer?\"]},\ncakir:{m:[\"Uşağım diyorlar ama köyün şerefi benim de şerefim!\",\"Küçüğüm ama korkum yok Şerif!\",\"Adil abinin yolunda ölürüm!\"],\ns:[\"Çakır uşak... Köyün küçüğü büyük konuşuyor.\",\"Kimse seni duymaz.\",\"Git evine çocuk.\"]}};\nvar PRO={\nesme:\"Adil'e kurşun sıktığın gecenin pişmanlığı seni her gün yakıyor. Kâğıt üstünde Şerif'in karısısın ama kalbin hep Koçari'de kaldı.\",\nadil:\"Esme'nin kurşunundan sonra Eleni hayatını kurtardı. Eleni'nin kızın olduğu gerçeği ve Esme'ye olan borcun seni bu yola çıkardı.\",\neleni:\"Yunanistan'dan büyük bir sırrın peşinde geldin. Adil'in hayatını kurtardın; şimdi sırrın iki ailenin tam ortasında olduğunu biliyorsun.\",\noruc:\"Hem savaşçı hem şifacısın. Amcan Şerif'in yaptıkları ailen için utanç, Eleni için kalbin çarpıyor.\",\niso:\"Sana amcana benzediğini söylüyorlar ama sen onun iyi yanını taşıyorsun. O iyi yanın şimdi amcanı durdurmak zorunda.\",\nzarife:\"Ailen için hiçbir sınır tanımadın. Ama bu kez Şerif sınırı aştı ve ailen sana ihtiyaç duyuyor.\",\nsirin:\"Ailenin büyüğüsün ve oğlun Şerif'in yolunu kaybettiğini görüyorsun. Anne yüreğin onu durdurmak için ayakta.\",\ngezep:\"Öfken yüzünden hatalar yaptın. Adil'e ve Koçari'ye borçlusun; bu kez öfkeni doğru yere yönelteceksin.\",\nfadime:\"Kaybolduğun günlerde ailenin tehlikeye girdiğini öğrendin. Abin Adil'in yanında olmak için yola çıktın.\",\neyuphan:\"Amirum Dayı'nın oğlusun, Koçari'nin aklı sende. Sessiz kalmanın bedelini artık ödemeye hazırsın.\",\ngokhan:\"Zarife'nin koruması olarak silah taşıdın, emir aldın. Şimdi kimin emrinde olacağını seçme zamanı.\",\ncakir:\"Köyün gençlerinden biri olarak şimdiye kadar izledin. Artık Adil'in yanında yer alma vakti.\"};\nvar EPI={\nesme:\"Esme yıllar sonra Adil'in yanında sabaha uyandı ve Eleni'ye gerçeği ilk kez kendi ağzından anlattı.\",\nadil:\"Adil Esme'nin elini bu kez bırakmadı; Eleni'ye babası olarak sarıldı.\",\neleni:\"Eleni sırrını çözdü: iki düşman aileyi birleştiren kendisiydi.\",\noruc:\"Oruç, Eleni'nin yanında kaldı; kılıcı bıraktı, şifacılığı seçti.\",\niso:\"İso amcasının gölgesinden çıktı ve Furtuna'nın yeni yüzü oldu.\",\nzarife:\"Zarife sırlarını açtı, ailesi onu affetti ve sofrada yeniden buluştular.\",\nsirin:\"Şirin oğlunun günahlarını sırtladı ama ailesini yeniden bir araya getirdi.\",\ngezep:\"Gezep öfkesini yendi ve Adil'in en güvenilir yoldaşı oldu.\",\nfadime:\"Fadime ailesine kavuştu ve Koçari'nin en cesur kızı olarak anıldı.\",\neyuphan:\"Eyüphan babası Amirum Dayı'nın öğüdünü yerine getirdi; Koçari'nin aklı o oldu.\",\ngokhan:\"Gökhan silahını bıraktı; artık yalnızca sevdiklerini koruyor.\",\ncakir:\"Çakır köyün gözünde büyüdü; artık kimse ona küçük demiyor.\"};\nvar LVD=[\n{pl:\"konakta\",a:\"Şerif hapisten çıkar çıkmaz oyunu başlattı: önce köyün suyunu zehirledi.\",b:\"Zehir kaynaktan akıyor. Vanayı kapatmazsan köyün suyu sonsuza kadar kirlenecek!\",arr:\"konağın kapısına varıyor... Şerif tam karşısında!\",th:\"Vanaya yetişemezsin. Zehir çoktan yola çıktı.\",end:\"Şerif karanlıkta kayboldu. Vanayı kapat, esirleri kurtar!\"},\n{pl:\"soğuk hava deposunda\",a:\"Şerif'in Rusya bağlantısı ortaya çıktı: Volkov'un adamlarıyla anlaşıp Koçari'nin soğuk hava deposunu tuzağa çevirdi.\",b:\"Depo artık bir ölüm tuzağı: buz kesmiş koridorlar, çöken sarkıtlar ve Şerif'in adamları.\",arr:\"karlı gecede deponun kapısına varıyor... Şerif orada!\",th:\"Buz duvarı kapanıyor. Isıtıcıları yakabilirsen kurtarırsın onları. Yetişebilirsen!\",end:\"Şerif karanlıkta kayboldu. Isıtıcıları yak, buz duvarını erit!\"},\n{pl:\"yaylanın sisli dağlarında\",a:\"Şerif köşeye sıkıştı ve son kozunu oynadı: sevdiklerini yaylanın sisli dağlarına kaçırdı.\",b:\"Sis o kadar yoğun ki yolu ancak şimşeklerin ışığında görebilirsin. Çürük köprüler ve yuvarlanan kayalar yolu kesiyor.\",arr:\"yayla kapısına varıyor... Telefonu çalıyor. Arayan Şerif!\",th:\"Yaylanın sonunda görüşürüz. Kendi ayağınla geleceksin.\",end:\"Sis her yeri sardı. Şimşeği bekle, yolunu bul ve Şerif'e yetiş!\"},\n{pl:\"liman depolarında\",a:\"Şerif Hamsi Limanı'nda bir gemiye binip çok uzaklara kaçmaya hazırlanıyor!\",b:\"Rıhtım: vinçler, kayan bantlar, dikenli iskeleler, fırtına dalgaları ve dev bir dalga seni bekliyor.\",arr:\"rıhtımın başına varıyor... Gemi düdüğü öttü!\",th:\"Gemi kalkmadan yetişemezsin. Bu rıhtım seni yutacak.\",end:\"Şerif gemiye doğru koştu. Rıhtım boyunca yetiş, gemi demir almadan!\"},\n{pl:\"çay fabrikasının çevresinde\",a:\"Kına gecesinden dönenlere kurulan pusunun ardından Şerif'in adamları iz bırakmadı. Tek ipucu: Trabzon yamaçlarındaki çay bahçeleri.\",b:\"Şerif için hayat bir satranç; bu teraslar da onun tahtası. Çürük teraslar, dikenli çitler, kayan arabalar ve vinç asansörleri yolu kesiyor.\",arr:\"bahçenin girişinde... Sisin içinde bir silüet: Şerif!\",th:\"Çay bahçeleri sessizdir. Burada bağırsan kimse duymaz.\",end:\"Şerif sisin içinde kayboldu. Teraslardan çıkıp fabrikaya ulaş!\"},\n{pl:\"vadinin dibinde, taşkının ortasında\",a:\"“Satranç bitmedi” diyen Şerif bu kez işi doğaya bıraktı: Fırtına Deresi'nin bendini yıktı.\",b:\"Sel vadiyi, vadi köyü, köy denizi basacak. Her dalga bir hamle, her heyelan bir tuzak.\",arr:\"vadinin girişinde... Yağmurun içinde Şerif'in kahkahası!\",th:\"Deniz taşacak demişlerdi. İşte, taşıyor! Önce sel, sonra kaya!\",end:\"Şerif kaleye doğru kaçtı. Seli ve heyelanı aş, bend kontrol evine ulaş!\"},\n{pl:\"kalenin zindanında\",a:\"Sel çekildi ama Şerif kaçmadı. Taş kalesinde, satranç tahtasının başında bekliyor.\",b:\"Kalenin her odası bir hamle: çürük köprüler, dikenli zindan, yürüyen bantlar ve yuvarlanan kayalar.\",arr:\"kapıdan girdi. Dev bir satranç tahtası... ortasında Şerif.\",th:\"Tüm taşlarımı yedin. Geriye bir tek şah kaldı: ben. Şah mat diyecek tek kişi benim!\",end:\"Kaleyi aş, esirleri kurtar ve Şerif'in kafasına üç kez zıpla!\"},\n{pl:\"Sümela kayalıklarında\",a:\"Kale yıkıldı ama Şerif'in cebinde son bir harita vardı: Altındere'nin üstündeki kayalıklar.\",b:\"Sümela'nın yamacında rüzgâr insanı uçurur. Rüzgâr uğulduyor, taş kütleler sarkıyor. Tek hata, uçurum.\",arr:\"patikada... Yukarıdan bir ses: ŞERİF!\",th:\"Aşağıdan bakınca her şey küçük görünür. Rüzgâr benden yana!\",end:\"Şerif manastıra doğru kaçıyor! Rüzgârı yen, düşen kayaların altından geç!\"},\n{pl:\"batığın ambarında\",a:\"Şerif manastırdan denize atladı ama bir planı vardı: Hamsi teknesini Karadeniz'in dibine gönderdi.\",b:\"Ambar kapıları kilitli, hava azalıyor. Denizin dibinde her adım süzülmek gibi; dönen çarklar ve kirpi dikenleri her yerde.\",arr:\"kaskını taktı... Geminin güvertesinden bir kahkaha duyuldu!\",th:\"Üç kapı, üç şalter. Hava bitmeden çıkabilirsen!\",end:\"Şalterleri bul, kapıları aç, ambara ulaş. Süre daralıyor!\"},\n{pl:\"son vagonda\",a:\"Şerif'in son kozu: gece trenini kaçırıp sınırı geçmek. Hesabı kapatmadan gidemez.\",b:\"Peşinden gelen duman duvarı her şeyi yutuyor. Vagonların üstünde tünel kirişleri, testereler, boşluklar ve ters rüzgâr var.\",arr:\"tren kalkarken son anda çatıya atladı!\",th:\"Bu tren, satranç tahtamın son karesi. Arkana bak: duman geliyor!\",end:\"Duman duvarı peşinde! Hiç durma, son vagona ulaş ve Şerif'e zıpla!\"}];\nfunction makeSeq(lv,rid,ch,hs,fin){\nvar d=LVD[lv],st=STAND[rid]||STAND.cakir,s=[{t:'title'}];\ns.push({t:'n");

er tehlikede... Yetiş!\"});\n}else if(lv===1){\nseq=[{t:'title'},\n{t:'nar',pp:false,x:rid==='adil'?\"Şerif seni Rusya'ya, yanan soğuk hava deposuna çekmişti. Ama sen tuzaktan çıkmayı başardın!\":\"Şerif, Adil'i Rusya'ya, Koçari'nin yanan soğuk hava deposuna çekti.\"},\n{t:'nar',pp:false,x:\"Depo artık bir ölüm tuzağı: buz kesmiş koridorlar, çöken sarkıtlar ve Şerif'in adamları.\"},\n{t:'nar',pp:false,x:ROLES[fin].k+\" içeride mahsur kaldı... Çıkış kapısı buzla kapandı!\"},\n{t:'nar',pp:false,x:ROLES[hs[0]].k+\" ve \"+ROLES[hs[1]].k+\" de aynı tuzağa düştü, kafeslerde donuyorlar.\"},\n{t:'nar',x:ch.name+\" karlı gecede deponun kapısına varıyor... Şerif orada!\"},\n{t:'say',who:'serif',x:\"Rusya'nın soğuğu çok acımasızdır. Seni de bulacak.\"},\n{t:'say',who:'me',x:L2LINE[rid]||L2LINE.cakir},\n{t:'say',who:'serif',x:\"Buz duvarı kapanıyor. Isıtıcıları yakabilirsen kurtarırsın onları... Yetişebilirsen!\"},\n{t:'flee'},\n{t:'nar',pp:false,x:\"Şerif karanlıkta kayboldu. Isıtıcıları yak, buz duvarını erit!\"}];\n}else{\nseq=[{t:'title'},\n{t:'nar',pp:false,x:rid==='eleni'?\"Şerif seni yaylanın sisli dağlarına kaçırmıştı. Ama sen kaçmayı başardın!\":\"Şerif köşeye sıkıştı ve son kozunu oynadı: Eleni'yi yaylanın sisli dağlarına kaçırdı!\"},\n{t:'nar',pp:false,x:\"Sis o kadar yoğun ki, yolu ancak şimşeklerin ışığında görebilirsin.\"},\n{t:'nar',pp:false,x:rid==='eleni'?\"Şerif şimdi de Esme'yi aynı yaylada tutuyor. Çürük köprüler, yuvarlanan kayalar ve Şerif'in avcıları yolu kesiyor.\":\"Çürük köprüler, yuvarlanan kayalar ve Şerif'in avcıları yolu kesiyor.\"},\n{t:'nar',pp:false,x:ROLES[hs[0]].k+\" ve \"+ROLES[hs[1]].k+\" de yaylada tuzağa düştü, kafeslerde bekliyorlar.\"},\n{t:'nar',x:ch.name+\" yayla kapısına varıyor... Telefonu çalıyor. Arayan Şerif!\"},\n{t:'say',who:'serif',x:\"Yaylanın sonunda görüşürüz. Kendi ayağınla geleceksin.\"},\n{t:'say',who:'me',x:L3LINE[rid]||L3LINE.cakir},\n{t:'say',who:'serif',x:\"Cesaretin hoşuma gitti. Bakalım sisi atlatabilecek misin?\"},\n{t:'nar',pp:false,x:\"Telefon kapandı. Sis her yeri sardı... Şimşeği bekle, yolunu bul!\"}];\n}\nif(lv===3){\nseq=[{t:'title'},\n{t:'nar',pp:false,x:\"Hamsi Limanı'nda bir gemide \"+ROLES[fin].k+\" esir tutuluyor. Şerif çok uzaklara kaçmaya hazırlanıyor!\"},\n{t:'nar',pp:false,x:\"Rıhtım: vinçler, yığılmış kasalar, kayan bantlar, dikenli iskeleler, fırtına dalgaları ve dev bir dalga seni bekliyor.\"},\n{t:'nar',pp:false,x:\"Gemi şafakta demir alacak. Rıhtım şimdiye kadarki en uzun parkur!\"},\n{t:'nar',pp:false,x:ROLES[hs[0]].k+\" ve \"+ROLES[hs[1]].k+\" de liman depolarında tutuluyor.\"},\n{t:'nar',x:ch.name+\" rıhtımın başına varıyor... Gemi düdüğü öttü!\"},\n{t:'say',who:'serif',x:\"Gemi kalkmadan yetişemezsin. Bu rıhtım seni yutacak.\"},\n{t:'say',who:'me',x:L4LINE[rid]||L4LINE.cakir},\n{t:'say',who:'serif',x:\"Hamsi Limanı'nda da kaybedeceksin. Elveda!\"},\n{t:'flee'},\n{t:'nar',pp:false,x:\"Şerif gemiye doğru koştu. Rıhtım boyunca yetiş, gemi demir almadan!\"}];\n}\nif(lv===4){\nseq=[{t:'title'},\n{t:'nar',pp:false,x:\"Kına gecesinden dönenlere kurulan pusunun ardından Şerif'in adamları iz bırakmadı.\"},\n{t:'nar',pp:false,x:\"Tek ipucu, Trabzon yamaçlarındaki Çay Bahçeleri. Şerif için hayat bir satranç; bu teraslar da onun tahtası.\"},\n{t:'nar',pp:false,x:ROLES[fin].k+\", \"+ROLES[hs[0]].k+\" ve \"+ROLES[hs[1]].k+\" çay fabrikasının çevresinde tutuluyor.\"},\n{t:'nar',pp:false,x:\"Çürük teraslar, dikenli çitler, kayan çay arabaları ve vinç asansörleri yolu kesiyor.\"},\n{t:'nar',x:ch.name+\" bahçenin girişinde... Sisin içinde bir silüet: Şerif!\"},\n{t:'say',who:'serif',x:\"Çay bahçeleri sessizdir. Burada bağırsan kimse duymaz.\"},\n{t:'say',who:'me',x:L5LINE[rid]||L5LINE.cakir},\n{t:'say',who:'serif',x:\"Hamleni yaptın. Şimdi sıra bende. Yetişebilirsen yetiş!\"},\n{t:'flee'},\n{t:'nar',pp:false,x:\"Şerif sisin içinde kayboldu. Teraslardan çıkıp fabrikaya ulaş!\"}];\n}\nif(lv===5){\nseq=[{t:'title'},\n{t:'nar',pp:false,x:\"Satranç bitmedi diyen Şerif, bu k
